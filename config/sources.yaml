  # ===== 渠道价格 / 促销监控（Google News 定向查询，捕捉降价/补货/折扣类动态） =====
  # 注：直接扒官方商城/Deals 页需逐站定制解析 + JS 站点需无头浏览器（破坏零依赖），
  # 这里用促销关键词的新闻聚合作为零依赖替代，覆盖大部分渠道价格信号。
  - id: gnews-gopro-deals
    name: GoPro 促销动态
    type: rss
    confidence: media
    region: global
    language: en
    market: US
    weight: 3
    url: https://news.google.com/rss/search?q=GoPro%20%28deal%20OR%20sale%20OR%20discount%20OR%20price%20drop%29%20when%3A3d&hl=en-US&gl=US&ceid=US:en
