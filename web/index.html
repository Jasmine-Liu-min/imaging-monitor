<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>影像行业与竞品信息监控看板</title>
    <style>
      :root{color-scheme:dark;--bg:#080b0c;--panel:#101516;--panel2:#151b1d;--text:#e7ecef;--muted:#7f8b92;--line:#223036;--accent:#2fd1c5;--green:#62c08a;--yellow:#d8b45d;--red:#e36b6b}
      *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
      header{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(8,11,12,.92);backdrop-filter:blur(14px)}
      .wrap{width:min(1220px,calc(100% - 32px));margin:0 auto}.topbar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:760;font-size:17px}.pulse{width:28px;height:28px;border:1px solid #1c6662;border-radius:8px;display:grid;place-items:center;color:var(--accent)}.meta{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      nav{display:flex;gap:4px;overflow-x:auto}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:12px 14px;font:inherit;white-space:nowrap;cursor:pointer}.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
      main{padding:34px 0 56px}.eyebrow{color:var(--accent);border:1px solid #1d5b57;background:#09201f;border-radius:5px;padding:3px 8px;display:inline-block}h1{font-size:30px;line-height:1.2;margin:14px 0 8px;letter-spacing:0}.subtitle{color:var(--muted);font-size:15px}
      .grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin:28px 0}.stat,.card{border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stat{padding:16px}.stat b{display:block;font-size:24px;color:var(--accent)}.stat span{color:var(--muted)}
      .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 18px}select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px}input{min-width:260px}
      .section-title{font-size:20px;font-weight:760;margin:30px 0 14px}.card{padding:18px}.event-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.event-title{font-size:16px;font-weight:760}.original{color:var(--muted);font-size:13px;margin-top:4px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.badge{border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:2px 8px;font-size:12px}.high{color:var(--red);border-color:#653030}.medium{color:var(--yellow);border-color:#5d4d25}.low{color:var(--green);border-color:#28583d}.summary{color:#c5cdd1}.insight{color:#9fb6b4;margin-top:10px}.details{color:var(--muted);margin:10px 0 0 18px;padding:0}.evidence{margin-top:12px;color:var(--muted);font-size:13px}.quality{margin-top:18px;color:var(--muted)}
      a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.empty{color:var(--muted);text-align:center;padding:40px;border:1px dashed var(--line);border-radius:8px}
      .banner{border-radius:8px;padding:12px 14px;margin:18px 0}.banner.err{border:1px solid #653030;background:#1c0f0f;color:#e89a9a}.banner.warn{border:1px solid #5d4d25;background:#1c1709;color:#d8b45d}
      label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer}label.chk input{min-width:0}
      .bc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bc-head{display:flex;justify-content:space-between;align-items:baseline}.bc-brand{font-size:18px;font-weight:760}.bc-new{color:var(--accent);font-size:13px}.bc-insight{color:#9fb6b4;margin:8px 0}.bc-mix{color:var(--muted);font-size:13px;margin-top:6px}.bc-ev{color:var(--muted);font-size:13px;margin:4px 0 0 16px;padding:0}.new-dot{color:var(--accent)}
      .spark{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:10px}.spark .bar{flex:1;background:#1d5b57;border-radius:3px 3px 0 0;min-height:2px;position:relative}.spark .bar .n{position:absolute;bottom:0;width:100%;background:var(--accent);border-radius:3px 3px 0 0}.trend-wrap{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;margin-top:14px}.trend-legend{color:var(--muted);font-size:13px;margin-top:8px}
      @media(max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bc-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;height:auto;padding:14px 0;flex-direction:column}h1{font-size:25px}input{min-width:100%}}
    </style>
  </head>
  <body>
    <header><div class="wrap"><div class="topbar"><div class="brand"><span class="pulse">⌁</span>产品图片与竞品监控 - 运营部</div><div class="meta" id="range">loading</div></div><nav id="tabs"></nav></div></header>
    <main class="wrap">
      <span class="eyebrow">报告</span>
      <h1>影像行业与竞品信息全维度监控看板</h1>
      <div class="subtitle">国内 / 国外 · 中文 / 英文 · 硬件动态 · 配套软件 · PMF场景 · 用户反馈 · 竞品营销</div>
      <div id="banner"></div>
      <section class="grid stats" id="stats"></section>
      <section id="overview"></section>
      <div class="toolbar" id="toolbar">
        <select id="regionFilter"><option value="all">全部区域</option><option value="domestic">国内</option><option value="global">国外</option></select>
        <select id="languageFilter"><option value="all">全部语言</option><option value="zh">中文源</option><option value="en">英文源</option><option value="other">其他</option></select>
        <select id="brandFilter"><option value="all">全部品牌</option></select>
        <select id="threatFilter"><option value="all">全部威胁</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
        <select id="confidenceFilter"><option value="all">全部可信度</option><option value="official">official</option><option value="media">media</option><option value="community">community</option><option value="rumor">rumor</option></select>
        <label class="chk"><input type="checkbox" id="newOnly" />仅看今日新增</label>
        <input id="searchInput" placeholder="搜索标题、摘要、洞察、来源" />
      </div>
      <section class="grid" id="events"></section>
    </main>
    <script>
      const CATS=[["overview","总览"],["key","重点动态"],["battlecard","竞品战卡"],["hardware","硬件动态"],["software","配套软件"],["industry","行业资讯"],["marketing","竞品营销"],["pmf","场景/需求信号"],["community","用户/社区"]];
      let state={tab:"overview",events:[],report:{},loaded:false};
      load();
      function load(){
        document.getElementById("range").textContent="loading…";
        document.getElementById("events").innerHTML=`<div class="empty">正在加载数据…</div>`;
        const grab=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
        Promise.allSettled([grab("../data/events.json"),grab("../data/report.json")]).then(([ev,rp])=>{
          if(ev.status!=="fulfilled"&&rp.status!=="fulfilled"){return fail("无法加载数据文件（events.json / report.json）。请先运行流水线生成 data/ 目录。")}
          state.events=ev.status==="fulfilled"&&Array.isArray(ev.value)?ev.value:[];
          state.report=rp.status==="fulfilled"&&rp.value?rp.value:{};
          state.loaded=true;init();render()
        })
      }
      function fail(msg){document.getElementById("range").textContent="加载失败";document.getElementById("banner").innerHTML=`<div class="banner err">⚠️ ${esc(msg)}</div>`;document.getElementById("events").innerHTML="";document.getElementById("stats").innerHTML=""}
      function freshness(){const g=state.report.generated_at;if(!g)return"暂无报告";const d=new Date(g);const ageH=(Date.now()-d.getTime())/3.6e6;const stale=ageH>30?' · ⚠️数据可能过期':'';return `最近更新 ${g.slice(0,16).replace("T"," ")}${stale}`}
      function init(){const h=(location.hash||"").replace("#","");if(CATS.some(([k])=>k===h))state.tab=h;document.getElementById("range").textContent=freshness();if(state.report.generated_at){const ageH=(Date.now()-new Date(state.report.generated_at).getTime())/3.6e6;document.getElementById("banner").innerHTML=ageH>30?`<div class="banner warn">数据已超过 30 小时未更新，可能不是最新状态（最近更新 ${esc(state.report.generated_at.slice(0,16).replace("T"," "))}）。</div>`:""}document.getElementById("tabs").innerHTML=CATS.map(([k,l])=>`<button class="tab" data-tab="${k}">${l}</button>`).join("");document.getElementById("tabs").onclick=e=>{if(!e.target.dataset.tab)return;state.tab=e.target.dataset.tab;render()};const brands=[...new Set(state.events.map(e=>e.brand).filter(Boolean))].sort();document.getElementById("brandFilter").innerHTML+=brands.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join("");["regionFilter","languageFilter","brandFilter","threatFilter","confidenceFilter","searchInput","newOnly"].forEach(id=>document.getElementById(id).addEventListener("input",render))}
      function render(){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===state.tab));const s=state.report.summary||{},q=state.report.quality||{};document.getElementById("stats").innerHTML=[["今日新增",s.new_count||0],["候选事件",s.candidate_count||state.events.length],["可推送",s.pushable_count||0],["国内",s.domestic_count||0],["国外",s.global_count||0]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");const isBC=state.tab==="battlecard",isOv=state.tab==="overview",isKey=state.tab==="key";document.getElementById("toolbar").style.display=(isBC||isOv)?"none":"flex";document.getElementById("overview").innerHTML=isOv?renderOverview():"";if(isOv){document.getElementById("events").innerHTML="";return}if(isBC){document.getElementById("events").innerHTML=renderBattlecards();return}const events=filteredEvents();const head=isKey?`<div class="section-title" style="grid-column:1/-1;margin-top:0">重点动态 · 建议推送或高威胁（共 ${events.length} 条）</div>`:"";document.getElementById("events").innerHTML=events.length?head+events.map(renderEvent).join(""):`<div class="empty">${isKey?"暂无重点动态":"暂无匹配的动态信息"}</div>`}
      function important(e){return e.pushed||e.threat_level==="high"}
      function renderOverview(){const top=state.report.top5||[],q=state.report.quality||{};return renderTrend()+`<div class="section-title">核心内容总结 · TOP5</div><div class="grid">${top.length?top.map((e,i)=>`<article class="card"><div class="event-title">${i+1}号　${esc(e.title_zh||e.title)}${e.is_new?' <span class="new-dot">●新</span>':''}</div><div class="original">${esc(e.title_original||"")}</div><p class="summary">${esc(e.summary_zh||e.summary||"")}</p></article>`).join(""):`<div class="empty">暂无高价值动态</div>`}</div><div class="quality">质量状态：AI ${q.ai_ok?"正常":"未启用/降级"} · 阶段 ${esc(q.ai_stage||"-")} · 丢弃 ${q.events_discarded||0} · 信源异常 ${q.source_failed||0}</div>`}
      function renderTrend(){const runs=state.report.trend||[];if(runs.length<2)return"";const max=Math.max(1,...runs.map(r=>r.candidate_count||0));const bars=runs.map(r=>{const c=r.candidate_count||0,n=r.new_count||0;return `<div class="bar" title="${esc((r.generated_at||"").slice(0,10))}: 候选 ${c} · 新增 ${n}" style="height:${Math.round(c/max*100)}%"><div class="n" style="height:${c?Math.round(n/c*100):0}%"></div></div>`}).join("");return `<div class="trend-wrap"><div class="section-title" style="margin:0">监控趋势（最近 ${runs.length} 次运行）</div><div class="spark">${bars}</div><div class="trend-legend">柱高=候选事件数 · 高亮段=当次新增（亮色 <span class="new-dot">■</span>）</div></div>`}
      function renderBattlecards(){const cards=state.report.battlecards||[];if(!cards.length)return `<div class="empty">暂无战卡数据</div>`;const self=cards.filter(c=>c.is_self),comp=cards.filter(c=>!c.is_self);let html="";if(self.length){html+=`<div class="section-title" style="margin-top:0">🏠 自家动态 · 关注用户反馈与自身节奏</div><div class="grid bc-grid">${self.map(c=>bcCard(c,true)).join("")}</div>`}html+=`<div class="section-title">⚔️ 竞品战卡 · 按威胁与活跃度排序</div>`+(comp.length?`<div class="grid bc-grid">${comp.map(c=>bcCard(c,false)).join("")}</div>`:`<div class="empty">本时段无竞品动态</div>`);return html}
      function bcCard(c,isSelf){const badge=isSelf?`<span class="badge" style="color:var(--accent);border-color:#1d5b57">🏠 自家品牌</span>`:`<span class="badge ${esc(c.threat_summary)}">威胁 ${esc(c.threat_summary)}</span>`;const label=isSelf?"自家解读":"战略含义";return `<article class="card"><div class="bc-head"><span class="bc-brand">${esc(c.brand)}</span><span class="bc-new">${c.new_count?`新增 ${c.new_count} · `:""}共 ${c.event_count} 条</span></div><div class="badges">${badge}<span class="badge">${"★".repeat(Number(c.max_importance||1))}</span></div><div class="bc-insight"><b>${label}：</b>${esc(c.key_insight_zh||"")}</div><div class="bc-mix">分类：${Object.entries(c.category_mix||{}).map(([k,n])=>`${esc(k)}×${n}`).join(" · ")}</div><ul class="bc-ev">${(c.latest_events||[]).slice(0,5).map(e=>`<li>${e.is_new?'<span class="new-dot">●</span> ':''}${esc(e.title_zh||e.title)}</li>`).join("")}</ul></article>`}
      function filteredEvents(){const region=v("regionFilter"),lang=v("languageFilter"),brand=v("brandFilter"),threat=v("threatFilter"),conf=v("confidenceFilter"),newOnly=document.getElementById("newOnly").checked,q=v("searchInput").toLowerCase();return state.events.filter(e=>{if(state.tab==="key"){if(!important(e))return false}else if(e.category!==state.tab)return false;if(newOnly&&!e.is_new)return false;if(region!=="all"&&e.region!==region)return false;if(lang!=="all"&&e.language!==lang)return false;if(brand!=="all"&&e.brand!==brand)return false;if(threat!=="all"&&e.threat_level!==threat)return false;if(conf!=="all"&&e.confidence!==conf)return false;if(q&&!`${e.title_zh} ${e.title_original} ${e.summary_zh} ${e.insight_zh} ${e.source_name}`.toLowerCase().includes(q))return false;return true}).sort((a,b)=>rank(b)-rank(a))}
      function renderEvent(e){const ev=(e.evidence||[])[0]||{};return `<article class="card"><div class="event-head"><div><div class="event-title">${e.is_new?'<span class="new-dot">●新</span> ':''}${esc(e.title_zh||e.title)}</div><div class="original">${esc(e.title_original||"")}</div></div><a href="${attr(ev.url||e.source_url)}" target="_blank" rel="noopener">来源</a></div><div class="badges"><span class="badge">${esc(e.brand)}</span><span class="badge">${esc(e.region)}</span><span class="badge">${esc(e.source_market)}</span><span class="badge">${esc(e.language)}</span><span class="badge">${esc(e.category)}</span><span class="badge ${esc(e.threat_level)}">${esc(e.threat_level)}</span><span class="badge">${esc(e.confidence)}</span><span class="badge">${"★".repeat(Number(e.importance_score||1))}</span><span class="badge">${esc(e.push_decision||"")}</span></div><div class="summary">${esc(e.summary_zh||e.summary||"")}</div><div class="insight"><b>洞察：</b>${esc(e.insight_zh||e.insight||"")}</div><ul class="details">${(e.details_zh||e.details||[]).map(d=>`<li>${esc(d)}</li>`).join("")}</ul><div class="evidence">证据：${(e.evidence||[]).map(x=>`<a href="${attr(x.url)}" target="_blank" rel="noopener">${esc(x.source_name||"来源")}</a>`).join(" · ")}</div></article>`}
      function rank(e){return({push:500,dashboard_only:100,discard:0}[e.push_decision]||0)+({high:300,medium:200,low:100}[e.threat_level]||0)+Number(e.importance_score||0)*10+Number(e.confidence_score||0)}
      function v(id){return document.getElementById(id).value}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function attr(s){return esc(s).replace(/"/g,"&quot;")}
    </script>
  </body>
</html>
