name: Imaging Monitor

on:
  workflow_dispatch:
  # Scheduled (automatic) runs are disabled for now: GitHub Pages is not enabled
  # on this repo yet, so the "Deploy to GitHub Pages" step would fail with a 404.
  # To re-enable automatic runs, first enable Pages
  # (Settings > Pages > Build and deployment > Source = GitHub Actions), then
  # uncomment the schedule block below. The Pages deploy steps are kept intact,
  # so once Pages is enabled the dashboard updates automatically on every run.
  # schedule:
  #   # Beijing 10:30 and 18:30
  #   - cron: "30 2 * * *"
  #   - cron: "30 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python tests/run_all.py
      - name: Run monitor
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_WIRE_API: ${{ secrets.AI_WIRE_API }}
          AI_MONITOR_REASONING_EFFORT: ${{ secrets.AI_MONITOR_REASONING_EFFORT }}
          AI_REASONING_EFFORT: ${{ secrets.AI_REASONING_EFFORT }}
          AI_DISABLE_RESPONSE_STORAGE: ${{ secrets.AI_DISABLE_RESPONSE_STORAGE }}
          AI_MAX_TOKENS: ${{ secrets.AI_MAX_TOKENS }}
          AI_TIMEOUT_SECONDS: ${{ secrets.AI_TIMEOUT_SECONDS }}
          AI_RETRY_ATTEMPTS: ${{ secrets.AI_RETRY_ATTEMPTS }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_VERSION: ${{ secrets.ANTHROPIC_VERSION }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PUBLIC_DASHBOARD_URL: ${{ secrets.PUBLIC_DASHBOARD_URL }}
        run: python -m imaging_monitor.cli run
      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update imaging monitor data"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
