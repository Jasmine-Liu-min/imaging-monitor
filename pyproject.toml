[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imaging-monitor"
version = "0.1.0"
description = "AI-native imaging competitor and market monitoring with static dashboard and Feishu alerts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Insta360" }
]
keywords = ["monitoring", "competitor-intelligence", "feishu", "dashboard", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: News/Diary",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.setuptools]
packages = ["imaging_monitor"]
